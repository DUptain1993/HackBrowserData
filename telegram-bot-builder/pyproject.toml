[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-bot-builder"
version = "0.1.0"
description = "Analyze a GitHub repository and generate a Telegram bot from its logic."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["anthropic>=0.49.0"]

[project.scripts]
botbuilder = "botbuilder.cli:main"

[tool.setuptools]
packages = ["botbuilder"]
